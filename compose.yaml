# Local development only. No application depends on these services yet.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: infra
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
