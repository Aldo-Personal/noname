# Local development only. PostgreSQL stores access data; Keycloak handles local sign-in.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: infra
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra"]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:8090:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-development-only
      KC_HOSTNAME: http://localhost:8090
    volumes:
      - ./dev/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak:/opt/keycloak/data
  redis:
    image: redis:7.4.5-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  keycloak:
  postgres:
