---
openapi: 3.1.0
info:
  title: Infra API
  version: 0.1.0
  description: Development Ethereum management API. Keys also authorize the separate
    configured gateway; see gateway.openapi.yaml.
paths:
  "/v1/status":
    get:
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v1/me":
    get:
      operationId: getCurrentUser
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Principal"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v1/projects":
    get:
      operationId: listProjects
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - projects
                properties:
                  projects:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/Project"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
    post:
      operationId: createProject
      security:
      - session: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Project"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must equal configured PUBLIC_ORIGIN. Browsers supply this header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NameInput"
  "/v1/projects/{project}/keys":
    get:
      operationId: listKeys
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - keys
                properties:
                  keys:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/Key"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: issueKey
      security:
      - session: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IssuedKey"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must equal configured PUBLIC_ORIGIN. Browsers supply this header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NameInput"
  "/v1/projects/{project}/keys/{key}":
    delete:
      operationId: revokeKey
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OK"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must equal configured PUBLIC_ORIGIN. Browsers supply this header.
  "/v1/projects/{project}/keys/{key}/rotate":
    post:
      operationId: rotateKey
      security:
      - session: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IssuedKey"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must equal configured PUBLIC_ORIGIN. Browsers supply this header.
  "/v1/key-check":
    get:
      operationId: checkKey
      security:
      - apiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KeyIdentity"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/auth/logout":
    post:
      operationId: logout
      security:
      - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OK"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must equal configured PUBLIC_ORIGIN. Browsers supply this header.
  "/auth/login":
    get:
      operationId: beginLogin
      responses:
        '302':
          description: OIDC provider redirect or successful application redirect
        '400':
          description: Invalid/expired state or denied login
        '401':
          description: Invalid identity
        '503':
          description: Dependency unavailable
  "/auth/callback":
    get:
      operationId: finishLogin
      responses:
        '302':
          description: OIDC provider redirect or successful application redirect
        '400':
          description: Invalid/expired state or denied login
        '401':
          description: Invalid identity
        '503':
          description: Dependency unavailable
  "/v1/projects/{project}/usage":
    get:
      security:
      - session: []
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      operationId: getProjectUsage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectUsage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v1/projects/{project}/limits":
    put:
      security:
      - session: []
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      operationId: setProjectLimits
      description: Requires the configured Origin. Changing limits preserves consumed
        usage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProjectLimits"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectLimits"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
components:
  schemas:
    Status:
      type: object
      required:
      - service
      - version
      - mode
      properties:
        service:
          const: api
        version:
          type: string
        mode:
          const: scaffold
    Principal:
      type: object
      required:
      - userId
      - organizationId
      - email
      properties:
        userId:
          type: string
        organizationId:
          type: string
        email:
          type: string
    NameInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: No leading or trailing whitespace.
    Project:
      type: object
      required:
      - id
      - name
      - chainId
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        chainId:
          type: integer
          const: 1
        createdAt:
          type: string
          format: date-time
    Key:
      type: object
      required:
      - id
      - projectId
      - name
      - prefix
      - createdAt
      - expiresAt
      - revokedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
    IssuedKey:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          "$ref": "#/components/schemas/Key"
        secret:
          type: string
          pattern: "^infra_sk_[a-f0-9]{64}$"
          description: Returned once. Store securely; never log or embed in browser
            applications.
    KeyIdentity:
      type: object
      required:
      - keyId
      - projectId
      - organizationId
      - chainId
      properties:
        keyId:
          type: string
        projectId:
          type: string
        organizationId:
          type: string
        chainId:
          const: 1
          type: integer
    OK:
      type: object
      required:
      - ok
      properties:
        ok:
          const: true
    Error:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    ProjectLimits:
      type: object
      additionalProperties: false
      required:
      - dailyUnits
      - minuteRequests
      properties:
        dailyUnits:
          type: integer
          minimum: 0
          maximum: 100000
        minuteRequests:
          type: integer
          minimum: 0
          maximum: 600
    ProjectUsage:
      type: object
      required:
      - limits
      - usedUnits
      - remainingUnits
      - resetsAt
      - days
      properties:
        limits:
          "$ref": "#/components/schemas/ProjectLimits"
        usedUnits:
          type: integer
          minimum: 0
          maximum: 100000
        remainingUnits:
          type: integer
          minimum: 0
          maximum: 100000
        resetsAt:
          type: string
          format: date-time
        days:
          type: array
          maxItems: 7
          items:
            type: object
            required:
            - units
            - pending
            - succeeded
            - upstreamError
            - timedOut
            - canceled
            - unknown
            - day
            properties:
              units:
                type: integer
                minimum: 0
                maximum: 100000
              pending:
                type: integer
                minimum: 0
                maximum: 100000
              succeeded:
                type: integer
                minimum: 0
                maximum: 100000
              upstreamError:
                type: integer
                minimum: 0
                maximum: 100000
              timedOut:
                type: integer
                minimum: 0
                maximum: 100000
              canceled:
                type: integer
                minimum: 0
                maximum: 100000
              unknown:
                type: integer
                minimum: 0
                maximum: 100000
              day:
                type: string
                format: date
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: infra_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: infra_sk_<random token>
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: Invalid origin
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: Missing or inaccessible resource
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: Access unconfigured or dependency unavailable
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
